:root{
--bg:#f3ede0;
--ink:#26211a;
--body:#3b352b;
--muted:#8b8172;
--accent:#8a362e;
--hairline-ink:#c6bba4;
}
@media (prefers-color-scheme: dark){:root{
--bg:#17130d;
--ink:#ece3d2;
--body:#dbd1be;
--muted:#7e7461;
--accent:#c6725e;
--hairline-ink:#4a4132;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);
  font-family:'Onest',system-ui,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.wrap{min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;
  padding:3rem 1.5rem;max-width:30rem;margin:0 auto;text-align:center}
/* Лого-мітка намальована чорнилом під СВІТЛИЙ фон (растр із фіксованими
   кольорами, як на картці-цитаті), тож на темній темі вона зникла б у тлі.
   Кладемо її на світлу плитку — так само, як маркет-банер. Колір плитки не
   залежить від схеми: він із світлої палітри автора в обох темах. */
.mark{width:96px;height:96px;margin-bottom:1.75rem;object-fit:contain;
  background:#fbf6ec;border-radius:22px;padding:15px;
  box-shadow:0 6px 18px rgba(0,0,0,.18)}
h1{margin:0;font-family:'Literata',Georgia,serif;font-weight:600;
  font-size:clamp(1.6rem,6.5vw,2.1rem);line-height:1.25;color:var(--ink)}
.cat{margin:.6rem 0 0;font-size:.9rem;letter-spacing:.04em;color:var(--muted)}
.rule{width:44px;height:2px;margin:1.75rem 0;background:var(--accent);
  border-radius:1px}
.cta{margin:0 0 1.5rem;font-size:1.05rem;line-height:1.5;color:var(--body)}
/* Clear space — вимога правил Google, а не повітря розкладки: в офіційному
   бейджі це поле було вбудоване в саму картинку, у нашому вектора нема, тож
   тримаємо його тут. Обвідка — теж не оздоблення: без неї чорна підкладка
   бейджа тоне в темній темі. Числа — з play_badge.dart, там і виведення. */
.badge{display:inline-block;line-height:0;padding:12px}
.badge img{width:158px;height:auto;
  border:1px solid #a6a6a6;
  border-radius:5.8px}
.app-store{display:inline-block;margin:.5rem 0;padding:.85rem 1.25rem;
  border:1px solid var(--accent);border-radius:8px;color:var(--ink);
  text-decoration:none;font-weight:600;line-height:1.4}
.app-store:hover{background:var(--bg);opacity:.85}
.install-note{font-size:.85rem;line-height:1.5;color:var(--muted)}
footer{margin-top:3rem;color:var(--muted);font-size:.8rem;line-height:1.6}
footer p{margin:0}
/* Атрибуція Google мусить лишатися читною, тож не тихіша за решту футера —
   лише дрібніша. */
.legal{margin-top:1rem;font-size:.7rem}
@media (prefers-reduced-motion:no-preference){
  .badge{transition:opacity .2s ease}
}
.badge:hover{opacity:.85}

</style>
</head>
